<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#40577a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;font-size:14px;fill:#233b61}.title{font-size:22px;font-weight:bold}.small{font-size:12px}.line{stroke:#40577a;fill:none;stroke-width:1.4}.node{fill:#f3f6fb;stroke:#879ab8}</style><text x="550" y="34" text-anchor="middle" class="title">Appointment confirmation sequence</text><rect class="node" x="50" y="65" width="160" height="44"/><text x="130" y="92" text-anchor="middle">Front desk</text><path class="line" stroke-dasharray="5 5" d="M130 109V750"/><rect class="node" x="330" y="65" width="160" height="44"/><text x="410" y="92" text-anchor="middle">Booking form</text><path class="line" stroke-dasharray="5 5" d="M410 109V750"/><rect class="node" x="610" y="65" width="160" height="44"/><text x="690" y="92" text-anchor="middle">Server service</text><path class="line" stroke-dasharray="5 5" d="M690 109V750"/><rect class="node" x="890" y="65" width="160" height="44"/><text x="970" y="92" text-anchor="middle">PostgreSQL</text><path class="line" stroke-dasharray="5 5" d="M970 109V750"/><path class="line" marker-end="url(#arrow)" d="M130 145H410"/><text class="small" x="270" y="136" text-anchor="middle">1. Select patient, doctor, date, and time</text><path class="line" marker-end="url(#arrow)" d="M410 194H690"/><text class="small" x="550" y="185" text-anchor="middle">2. Request availability</text><path class="line" marker-end="url(#arrow)" d="M690 243H970"/><text class="small" x="830" y="234" text-anchor="middle">3. Query hours, bookings, and blocks</text><path class="line" marker-end="url(#arrow)" d="M970 292H690"/><text class="small" x="830" y="283" text-anchor="middle">4. Return available intervals</text><path class="line" marker-end="url(#arrow)" d="M690 341H410"/><text class="small" x="550" y="332" text-anchor="middle">5. Return start times</text><path class="line" marker-end="url(#arrow)" d="M410 390H130"/><text class="small" x="270" y="381" text-anchor="middle">6. Show review, no booking saved</text><path class="line" marker-end="url(#arrow)" d="M130 439H410"/><text class="small" x="270" y="430" text-anchor="middle">7. Confirm appointment</text><path class="line" marker-end="url(#arrow)" d="M410 488H690"/><text class="small" x="550" y="479" text-anchor="middle">8. Send validated booking request</text><path class="line" marker-end="url(#arrow)" d="M690 537H970"/><text class="small" x="830" y="528" text-anchor="middle">9. Begin transaction; insert booking and audit</text><path class="line" marker-end="url(#arrow)" d="M970 586H690"/><text class="small" x="830" y="577" text-anchor="middle">10. Commit, or reject constraint and roll back</text><path class="line" marker-end="url(#arrow)" d="M690 635H410"/><text class="small" x="550" y="626" text-anchor="middle">11. Return committed result or conflict</text><path class="line" marker-end="url(#arrow)" d="M410 684H130"/><text class="small" x="270" y="675" text-anchor="middle">12. Display confirmation or conflict</text></svg>